<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>hachiue (鉢植え) — Mobile WebGPU LLM & Translation Runtime</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f6f2;
      --card: #ffffff;
      --fg: #1c1b18;
      --muted: #6e6a63;
      --line: #e4e0d8;
      --accent: #2d6a4f;
      --accent-hover: #1b4332;
      --accent-fg: #ffffff;
      --user-bg: #e9f5ee;
      --danger: #c1121f;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121412;
        --card: #1b1e1b;
        --fg: #eae8e3;
        --muted: #98968f;
        --line: #2d322d;
        --accent: #52b788;
        --accent-hover: #74c69d;
        --accent-fg: #0b1c13;
        --user-bg: #1e3528;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100dvh;
      margin: 0;
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 17px;
    }
    .gh-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-weight: 500;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      transition: color 0.15s, border-color 0.15s;
    }
    .gh-link:hover {
      color: var(--fg);
      border-color: var(--muted);
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      flex: 1;
      justify-content: flex-end;
    }
    select, button, input, textarea {
      font: inherit;
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--fg);
    }
    button { cursor: pointer; }
    button.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: transparent;
      font-weight: 600;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-bar {
      padding: 8px 16px;
      font-size: 13px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .progress-wrap {
      width: 100%;
      height: 6px;
      background: var(--line);
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.15s ease;
    }
    .mode-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 16px 0;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      max-width: 100%;
    }
    .mode-tab {
      padding: 7px 16px;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      position: relative;
      bottom: -1px;
    }
    .mode-tab.active {
      background: var(--bg);
      color: var(--fg);
      border-color: var(--line);
      border-bottom-color: var(--bg);
    }
    .view-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .view-panel.hidden {
      display: none !important;
    }
    main#chatBox {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    .msg {
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 88%;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--card);
      border: 1px solid var(--line);
      white-space: normal;
      max-width: 94%;
    }
    .md-body > :first-child { margin-top: 0; }
    .md-body > :last-child { margin-bottom: 0; }
    .md-body p, .md-body ul, .md-body ol, .md-body pre, .md-body blockquote, .md-body table { margin: 8px 0; }
    .md-body h3, .md-body h4, .md-body h5 { margin: 12px 0 6px; line-height: 1.3; }
    .md-body h3 { font-size: 16px; }
    .md-body h4 { font-size: 14.5px; }
    .md-body h5 { font-size: 13.5px; }
    .md-body ul, .md-body ol { padding-left: 22px; }
    .md-body li { margin: 3px 0; }
    .md-body code {
      font: 12.5px/1.6 var(--mono);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 1px 5px;
    }
    .md-body pre {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      overflow-x: auto;
    }
    .md-body pre code { background: none; border: 0; padding: 0; white-space: pre; }
    .md-body blockquote { border-left: 3px solid var(--accent); padding: 2px 12px; color: var(--muted); }
    .md-body table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; font-variant-numeric: tabular-nums; }
    .md-body th, .md-body td { border: 1px solid var(--line); padding: 4px 10px; text-align: left; }
    .md-body th { background: var(--bg); }
    .md-body a { color: var(--accent); }
    .md-body hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
    .stats {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }
    footer {
      padding: 12px 16px;
      background: var(--card);
      border-top: 1px solid var(--line);
      display: flex;
      gap: 8px;
      max-width: 820px;
      width: 100%;
      margin: 0 auto;
    }
    footer input { flex: 1; }

    /* Translate Panel Styles */
    .translate-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .trans-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .trans-header {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .submode-toggle {
      display: inline-flex;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .submode-btn {
      border: 0;
      background: transparent;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }
    .submode-btn.active {
      background: var(--card);
      color: var(--fg);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .lang-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
    }
    textarea.trans-textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }
    .trans-output {
      min-height: 90px;
      padding: 12px 14px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--line);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .opt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      🪴 hachiue
      <span style="font-weight:400;font-size:13px;color:var(--muted)">Mobile WebGPU LLM & Translation</span>
      <a class="gh-link" href="https://github.com/toyoshim-i/hachiue" target="_blank" rel="noopener noreferrer" title="View source on GitHub">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        GitHub
      </a>
    </div>
    <div class="controls">
      <select id="modelSelect">
        <optgroup label="PLaMo 3 Translate (PFN Dedicated Translation)">
          <option value="https://huggingface.co/pfnet/plamo-3-translate-0.8b-GGUF/resolve/main/plamo-3-translate-0.8b-Q4_0.gguf">PLaMo 3 Translate 0.8B Q4_0 (522 MiB)</option>
          <option value="https://huggingface.co/pfnet/plamo-3-translate-0.8b-GGUF/resolve/main/plamo-3-translate-0.8b-Q4_K_M.gguf">PLaMo 3 Translate 0.8B Q4_K_M (546 MiB)</option>
          <option value="https://huggingface.co/pfnet/plamo-3-translate-2b-GGUF/resolve/main/plamo-3-translate-2b-Q4_0.gguf">PLaMo 3 Translate 2B Q4_0 (1,620 MiB)</option>
          <option value="https://huggingface.co/pfnet/plamo-3-translate-2b-GGUF/resolve/main/plamo-3-translate-2b-Q4_K_M.gguf">PLaMo 3 Translate 2B Q4_K_M (1,723 MiB)</option>
        </optgroup>
        <optgroup label="Bonsai 1 (Binary 1-bit Q1_0)">
          <option value="https://huggingface.co/prism-ml/Bonsai-1.7B-gguf/resolve/main/Bonsai-1.7B-Q1_0.gguf" selected>Bonsai 1.7B Q1_0 (237 MiB)</option>
          <option value="https://huggingface.co/prism-ml/Bonsai-4B-gguf/resolve/main/Bonsai-4B-Q1_0.gguf">Bonsai 4B Q1_0 (546 MiB)</option>
          <option value="https://huggingface.co/prism-ml/Bonsai-8B-gguf/resolve/main/Bonsai-8B-Q1_0.gguf">Bonsai 8B Q1_0 (1,105 MiB)</option>
        </optgroup>
        <optgroup label="Bonsai 2 (Ternary 1.58-bit PTQ1_0 / PQ2_0 + FWHT)">
          <option value="https://huggingface.co/prism-ml/Ternary-Bonsai-2-2B-gguf/resolve/main/Ternary-Bonsai-2-2B-PTQ1_0.gguf">Bonsai 2 2B PTQ1_0 (409 MiB)</option>
          <option value="https://huggingface.co/prism-ml/Ternary-Bonsai-2-2B-gguf/resolve/main/Ternary-Bonsai-2-2B-PQ2_0.gguf">Bonsai 2 2B PQ2_0 (493 MiB)</option>
          <option value="https://huggingface.co/prism-ml/Ternary-Bonsai-2-4B-gguf/resolve/main/Ternary-Bonsai-2-4B-PTQ1_0.gguf">Bonsai 2 4B PTQ1_0 (906 MiB)</option>
          <option value="https://huggingface.co/prism-ml/Ternary-Bonsai-2-4B-gguf/resolve/main/Ternary-Bonsai-2-4B-PQ2_0.gguf">Bonsai 2 4B PQ2_0 (1,093 MiB)</option>
        </optgroup>
        <optgroup label="Ternary Bonsai 1 (PQ2_0)">
          <option value="https://huggingface.co/prism-ml/Ternary-Bonsai-1.7B-gguf/resolve/main/Ternary-Bonsai-1.7B-PQ2_0.gguf">Ternary Bonsai 1.7B PQ2_0 (442 MiB)</option>
          <option value="https://huggingface.co/prism-ml/Ternary-Bonsai-4B-gguf/resolve/main/Ternary-Bonsai-4B-PQ2_0.gguf">Ternary Bonsai 4B PQ2_0 (1,025 MiB)</option>
        </optgroup>
      </select>
      <button id="loadBtn" class="primary">Load Model</button>
      <button id="prefetchBtn" title="Download selected model into browser cache in the background while keeping the current model active">Prefetch</button>
      <button id="clearChatBtn" disabled title="Reset conversation history and KV/recurrent cache">Reset Cache</button>
    </div>
  </header>

  <div class="status-bar">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;">
      <div id="statusText">Select a PLaMo 3 Translate or Bonsai model and tap "Load Model".</div>
      <div id="storageRow" style="display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;">
        <span id="prefetchStatus" style="color:var(--accent);"></span>
        <span id="storageUsage"></span>
        <button id="clearCacheBtn" style="font-size:12px;padding:3px 9px;display:none;" title="Remove downloaded model chunks from OPFS / IndexedDB">Remove downloaded models</button>
      </div>
    </div>
    <div class="progress-wrap" id="progWrap"><div class="progress-bar" id="progBar"></div></div>
  </div>

  <div class="mode-tabs">
    <button id="tabTranslate" class="mode-tab active">🌐 Translate (Text & Term)</button>
    <button id="tabChat" class="mode-tab">💬 Chat</button>
  </div>

  <!-- Translate View -->
  <div id="translatePanel" class="view-panel">
    <div class="translate-container">
      <div class="trans-card">
        <div class="trans-header">
          <div class="submode-toggle" role="tablist">
            <button id="submodeTextBtn" class="submode-btn active" type="button">📄 Document / Sentence (translateText)</button>
            <button id="submodeTermBtn" class="submode-btn" type="button">📖 Word / Phrase Lookup (translateTerm)</button>
          </div>
          <div class="lang-bar">
            <label class="field-label" for="srcLangSelect">From</label>
            <select id="srcLangSelect">
              <option value="en" selected>English (en)</option>
              <option value="ja">Japanese (ja)</option>
              <option value="zh-CN">Chinese Simplified (zh-CN)</option>
              <option value="zh-TW">Chinese Traditional (zh-TW)</option>
              <option value="ko">Korean (ko)</option>
              <option value="es">Spanish (es)</option>
              <option value="fr">French (fr)</option>
              <option value="de">German (de)</option>
            </select>
            <span style="color:var(--muted)">→</span>
            <label class="field-label" for="tgtLangSelect">To</label>
            <select id="tgtLangSelect">
              <option value="ja" selected>Japanese (日本語)</option>
              <option value="ja-easy">Easy Japanese (やさしい日本語)</option>
              <option value="en">English</option>
              <option value="zh-CN">Chinese Simplified (简体中文)</option>
              <option value="zh-TW">Chinese Traditional (繁體中文)</option>
              <option value="ko">Korean (한국어)</option>
              <option value="es">Spanish (Español)</option>
              <option value="fr">French (Français)</option>
              <option value="de">German (Deutsch)</option>
            </select>
            <select id="formSelect" title="Japanese style (Polite vs Plain)">
              <option value="">Style: Auto</option>
              <option value="polite">Polite (です・ます)</option>
              <option value="plain">Plain (だ・である)</option>
            </select>
          </div>
        </div>

        <!-- Text Mode Inputs -->
        <div id="textInputsWrap" class="field-group">
          <label class="field-label" for="transTextInput">Source Text</label>
          <textarea id="transTextInput" class="trans-textarea" placeholder="Enter sentences or paragraphs to translate...">Small trees thrive in small pots. With 1-bit and 4-bit quantization on WebGPU, language models run directly inside mobile browsers.</textarea>
        </div>

        <!-- Term Mode Inputs -->
        <div id="termInputsWrap" class="field-group" style="display:none;">
          <label class="field-label" for="transTermInput">Target Word or Short Phrase</label>
          <input id="transTermInput" type="text" value="bank" placeholder="e.g. bank, spring, extract vital cues" />
        </div>

        <div class="opt-grid">
          <div class="field-group">
            <label class="field-label" for="transContextInput">Optional Context (surrounding sentence or domain note)</label>
            <input id="transContextInput" type="text" placeholder="e.g. The river bank was overflowing after heavy rain." />
          </div>
          <div id="glossaryGroup" class="field-group">
            <label class="field-label" for="transGlossaryInput">Optional Glossary (`source=target`, comma-separated)</label>
            <input id="transGlossaryInput" type="text" placeholder="e.g. pots=植木鉢, quantization=量子化" />
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:8px;align-items:center;">
          <button id="runTransBtn" class="primary" disabled>Translate</button>
        </div>

        <div class="field-group">
          <label class="field-label">Translation Output</label>
          <div id="transOutputBox" class="trans-output"></div>
          <div id="transStatsBox" class="stats"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat View -->
  <div id="chatPanel" class="view-panel hidden">
    <main id="chatBox"></main>
    <footer>
      <input id="promptInput" type="text" placeholder="Type a message..." disabled />
      <button id="sendBtn" class="primary" disabled>Send</button>
    </footer>
  </div>

  <script type="module">
    import {
      HachiueEngine,
      clearModelCache,
      getCachedModelSize,
      prefetchModel,
      translateTerm,
      translateText,
    } from '../dist/index.js'

    const modelSelect = document.getElementById('modelSelect')
    const loadBtn = document.getElementById('loadBtn')
    const prefetchBtn = document.getElementById('prefetchBtn')
    const clearChatBtn = document.getElementById('clearChatBtn')
    const clearCacheBtn = document.getElementById('clearCacheBtn')
    const prefetchStatus = document.getElementById('prefetchStatus')
    const storageUsage = document.getElementById('storageUsage')
    const statusText = document.getElementById('statusText')
    const progWrap = document.getElementById('progWrap')
    const progBar = document.getElementById('progBar')

    // Mode tabs
    const tabTranslate = document.getElementById('tabTranslate')
    const tabChat = document.getElementById('tabChat')
    const translatePanel = document.getElementById('translatePanel')
    const chatPanel = document.getElementById('chatPanel')

    // Translate UI elements
    const submodeTextBtn = document.getElementById('submodeTextBtn')
    const submodeTermBtn = document.getElementById('submodeTermBtn')
    const textInputsWrap = document.getElementById('textInputsWrap')
    const termInputsWrap = document.getElementById('termInputsWrap')
    const glossaryGroup = document.getElementById('glossaryGroup')
    const srcLangSelect = document.getElementById('srcLangSelect')
    const tgtLangSelect = document.getElementById('tgtLangSelect')
    const formSelect = document.getElementById('formSelect')
    const transTextInput = document.getElementById('transTextInput')
    const transTermInput = document.getElementById('transTermInput')
    const transContextInput = document.getElementById('transContextInput')
    const transGlossaryInput = document.getElementById('transGlossaryInput')
    const runTransBtn = document.getElementById('runTransBtn')
    const transOutputBox = document.getElementById('transOutputBox')
    const transStatsBox = document.getElementById('transStatsBox')

    // Chat UI elements
    const chatBox = document.getElementById('chatBox')
    const promptInput = document.getElementById('promptInput')
    const sendBtn = document.getElementById('sendBtn')

    let engine = null
    let messages = []
    let busy = false
    let abortCtrl = null
    let prefetchCtrl = null
    let prefetchPromise = null
    let translateSubmode = 'text' // 'text' | 'term'
    const cachedUrls = new Set()

    tabTranslate.onclick = () => {
      tabTranslate.classList.add('active')
      tabChat.classList.remove('active')
      translatePanel.classList.remove('hidden')
      chatPanel.classList.add('hidden')
    }
    tabChat.onclick = () => {
      tabChat.classList.add('active')
      tabTranslate.classList.remove('active')
      chatPanel.classList.remove('hidden')
      translatePanel.classList.add('hidden')
    }

    submodeTextBtn.onclick = () => {
      translateSubmode = 'text'
      submodeTextBtn.classList.add('active')
      submodeTermBtn.classList.remove('active')
      textInputsWrap.style.display = ''
      termInputsWrap.style.display = 'none'
      glossaryGroup.style.display = ''
    }
    submodeTermBtn.onclick = () => {
      translateSubmode = 'term'
      submodeTermBtn.classList.add('active')
      submodeTextBtn.classList.remove('active')
      textInputsWrap.style.display = 'none'
      termInputsWrap.style.display = ''
      glossaryGroup.style.display = 'none'
      if (!transContextInput.value) {
        transContextInput.value = 'The river bank was overflowing after the heavy rain.'
      }
    }

    const fmtBytes = (b) => b >= 1e9 ? `${(b / 1e9).toFixed(2)} GB` : `${(b / 1e6).toFixed(0)} MB`

    const escHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
    const inlineMd = (s) => {
      const codes = []
      s = s.replace(/`([^`\n]+)`/g, (_, c) => `\x00${codes.push(c) - 1}\x00`)
      s = s
        .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
        .replace(/(^|[\s(])\*(\S(?:[^*\n]*\S)?)\*/g, '$1<i>$2</i>')
        .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
      return s.replace(/\x00(\d+)\x00/g, (_, i) => `<code>${codes[+i]}</code>`)
    }
    const renderMarkdown = (src) => {
      const lines = escHtml(src).split('\n')
      let html = ''
      let i = 0
      let para = []
      const flush = () => {
        if (para.length) {
          html += `<p>${para.map(inlineMd).join('<br>')}</p>`
          para = []
        }
      }
      while (i < lines.length) {
        const l = lines[i]
        if (/^\s*```/.test(l)) {
          flush()
          const buf = []
          for (i++; i < lines.length && !/^\s*```/.test(lines[i]); ) buf.push(lines[i++])
          i++
          html += `<pre><code>${buf.join('\n')}</code></pre>`
          continue
        }
        const h = l.match(/^(#{1,3})\s+(.*)/)
        if (h) {
          flush()
          const n = h[1].length + 2
          html += `<h${n}>${inlineMd(h[2])}</h${n}>`
          i++
          continue
        }
        if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) {
          flush()
          html += '<hr>'
          i++
          continue
        }
        if (/^\s*&gt;\s?/.test(l)) {
          flush()
          const buf = []
          while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*&gt;\s?/, ''))
          html += `<blockquote>${buf.map(inlineMd).join('<br>')}</blockquote>`
          continue
        }
        if (/^\s*\|.*\|\s*$/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] ?? '')) {
          flush()
          const cells = (s) =>
            s
              .trim()
              .replace(/^\||\|$/g, '')
              .split('|')
              .map((c) => inlineMd(c.trim()))
          html += `<table><thead><tr>${cells(l).map((c) => `<th>${c}</th>`).join('')}</tr></thead><tbody>`
          for (i += 2; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); ) {
            html += `<tr>${cells(lines[i++]).map((c) => `<td>${c}</td>`).join('')}</tr>`
          }
          html += '</tbody></table>'
          continue
        }
        if (/^(\s*)([-*+]|\d+[.)])\s+/.test(l)) {
          flush()
          const items = []
          let m
          while (i < lines.length && (m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)/))) {
            items.push({ ind: Math.floor(m[1].replace(/\t/g, '  ').length / 2), ord: /\d/.test(m[2]), text: m[3] })
            i++
          }
          const stack = []
          for (const it of items) {
            const depth = Math.min(it.ind, stack.length) + 1
            while (stack.length > depth) html += `</li></${stack.pop()}>`
            if (stack.length === depth) html += '</li>'
            while (stack.length < depth) {
              const tag = it.ord ? 'ol' : 'ul'
              html += `<${tag}>`
              stack.push(tag)
            }
            html += `<li>${inlineMd(it.text)}`
          }
          while (stack.length) html += `</li></${stack.pop()}>`
          continue
        }
        if (!l.trim()) {
          flush()
          i++
          continue
        }
        para.push(l)
        i++
      }
      flush()
      return html
    }

    function updatePrefetchBtnState() {
      if (prefetchCtrl) {
        prefetchBtn.disabled = false
        prefetchBtn.textContent = 'Cancel Prefetch'
        return
      }
      const isCached = cachedUrls.has(modelSelect.value)
      prefetchBtn.disabled = isCached || loadBtn.disabled
      prefetchBtn.textContent = isCached ? 'Cached ✓' : 'Prefetch'
    }

    async function refreshCacheBadges() {
      let cachedCount = 0
      let cachedBytes = 0
      cachedUrls.clear()
      for (const opt of modelSelect.options) {
        const size = await getCachedModelSize(opt.value)
        if (size > 0) {
          cachedCount++
          cachedBytes += size
          cachedUrls.add(opt.value)
        }
        const base = opt.textContent.replace(/ ✓ cached$/, '')
        opt.textContent = size > 0 ? `${base} ✓ cached` : base
      }
      if (cachedCount > 0) {
        storageUsage.textContent = `${cachedCount} model${cachedCount > 1 ? 's' : ''} cached (${fmtBytes(cachedBytes)})`
        clearCacheBtn.style.display = 'inline-block'
      } else {
        storageUsage.textContent = ''
        clearCacheBtn.style.display = 'none'
      }
      updatePrefetchBtnState()
    }
    refreshCacheBadges()

    modelSelect.onchange = () => updatePrefetchBtnState()

    prefetchBtn.onclick = async () => {
      if (prefetchCtrl) {
        prefetchCtrl.abort()
        return
      }
      const url = modelSelect.value
      const label = modelSelect.selectedOptions[0]?.textContent?.replace(/ ✓ cached$/, '') || 'model'
      prefetchCtrl = new AbortController()
      updatePrefetchBtnState()
      progWrap.style.display = 'block'
      progBar.style.width = '0%'
      prefetchStatus.textContent = `Prefetching ${label}...`

      prefetchPromise = (async () => {
        try {
          await prefetchModel(url, {
            signal: prefetchCtrl.signal,
            onProgress: (p) => {
              if (p.phase === 'weights' && p.totalBytes) {
                const pct = ((p.loadedBytes / p.totalBytes) * 100).toFixed(1)
                const mb = (p.loadedBytes / 1048576).toFixed(0)
                const totMb = (p.totalBytes / 1048576).toFixed(0)
                progBar.style.width = `${pct}%`
                prefetchStatus.textContent = `Prefetching: ${mb} / ${totMb} MiB (${pct}%)`
              }
            },
          })
          prefetchStatus.textContent = `Prefetched ${label} ✓`
          setTimeout(() => {
            if (!prefetchCtrl && prefetchStatus.textContent.startsWith('Prefetched')) {
              prefetchStatus.textContent = ''
            }
          }, 4000)
        } catch (err) {
          if (err?.name === 'AbortError') {
            prefetchStatus.textContent = 'Prefetch paused (completed chunks saved)'
          } else {
            prefetchStatus.textContent = `Prefetch error: ${err.message || err}`
            console.error(err)
          }
        } finally {
          prefetchCtrl = null
          prefetchPromise = null
          progWrap.style.display = 'none'
          await refreshCacheBadges()
        }
      })()
    }

    clearChatBtn.onclick = () => {
      if (busy && abortCtrl) abortCtrl.abort()
      messages = []
      engine?.resetCache()
      chatBox.innerHTML = ''
      statusText.textContent = 'KV & recurrent cache reset.'
    }

    clearCacheBtn.onclick = async () => {
      if (prefetchCtrl) {
        prefetchCtrl.abort()
        await prefetchPromise?.catch(() => {})
      }
      await clearModelCache()
      await refreshCacheBadges()
      prefetchStatus.textContent = ''
      statusText.textContent = 'Downloaded models removed from browser cache (OPFS / IndexedDB).'
    }

    loadBtn.onclick = async () => {
      const url = modelSelect.value
      if (prefetchCtrl) {
        prefetchCtrl.abort()
        await prefetchPromise?.catch(() => {})
      }
      prefetchStatus.textContent = ''
      loadBtn.disabled = true
      prefetchBtn.disabled = true
      modelSelect.disabled = true
      clearChatBtn.disabled = true
      runTransBtn.disabled = true
      progWrap.style.display = 'block'
      progBar.style.width = '0%'

      try {
        if (engine) {
          engine.dispose()
          engine = null
        }
        messages = []
        chatBox.innerHTML = ''

        engine = await HachiueEngine.create({
          url,
          maxSeqLen: 1024,
          onProgress: (p) => {
            if (p.phase === 'weights' && p.totalBytes) {
              const pct = ((p.loadedBytes / p.totalBytes) * 100).toFixed(1)
              const mb = (p.loadedBytes / 1048576).toFixed(0)
              const totMb = (p.totalBytes / 1048576).toFixed(0)
              progBar.style.width = `${pct}%`
              statusText.textContent = `${p.cached ? 'Loading from local cache' : 'Streaming 16MiB Range chunks'}: ${mb} / ${totMb} MiB (${pct}%)`
            } else if (p.message) {
              statusText.textContent = p.message
            }
          },
        })

        progWrap.style.display = 'none'
        statusText.textContent = `Ready: ${engine.arch.modelName} (${engine.arch.archName}, ${engine.arch.layers}L, vocab=${engine.arch.vocab})`
        promptInput.disabled = false
        sendBtn.disabled = false
        runTransBtn.disabled = false
        clearChatBtn.disabled = false
        await refreshCacheBadges()
      } catch (err) {
        progWrap.style.display = 'none'
        statusText.textContent = `Error: ${err.message || err}`
        console.error(err)
      } finally {
        loadBtn.disabled = false
        modelSelect.disabled = false
        updatePrefetchBtnState()
      }
    }

    function parseGlossaryInput(raw) {
      if (!raw || !raw.trim()) return undefined
      const entries = []
      for (const part of raw.split(',')) {
        const eq = part.indexOf('=')
        if (eq > 0) {
          const source = part.slice(0, eq).trim()
          const target = part.slice(eq + 1).trim()
          if (source && target) entries.push({ source, target })
        }
      }
      return entries.length > 0 ? entries : undefined
    }

    async function runTranslation() {
      if (busy) {
        abortCtrl?.abort()
        return
      }
      if (!engine) return
      busy = true
      abortCtrl = new AbortController()
      runTransBtn.textContent = 'Stop'
      transOutputBox.textContent = ''
      transStatsBox.textContent = ''

      let streamed = ''
      try {
        let res
        if (translateSubmode === 'term') {
          const term = transTermInput.value.trim()
          if (!term) return
          res = await translateTerm(engine, {
            term,
            sourceLang: srcLangSelect.value,
            targetLang: tgtLangSelect.value,
            context: transContextInput.value.trim() || undefined,
            signal: abortCtrl.signal,
            onToken: (_id, delta) => {
              streamed += delta
              transOutputBox.textContent = streamed
            },
          })
        } else {
          const text = transTextInput.value.trim()
          if (!text) return
          res = await translateText(engine, {
            text,
            sourceLang: srcLangSelect.value,
            targetLang: tgtLangSelect.value,
            context: transContextInput.value.trim() || undefined,
            glossary: parseGlossaryInput(transGlossaryInput.value),
            form: formSelect.value || undefined,
            signal: abortCtrl.signal,
            onToken: (_id, delta) => {
              streamed += delta
              transOutputBox.textContent = streamed
            },
          })
        }
        transOutputBox.textContent = res.translation
        const ctxNote = res.usedContext ? ' · context applied' : ''
        transStatsBox.textContent =
          `${res.stats.generatedTokens} tokens · ${res.stats.decodeTokensPerSec.toFixed(1)} tok/s · prefill ${res.stats.prefillMs.toFixed(0)} ms (${res.stats.promptTokens} tok)` +
          (res.stats.reusedCache ? ' · cache reused' : '') +
          ctxNote
      } catch (err) {
        if (err.name === 'AbortError') {
          transOutputBox.textContent = `${streamed} [stopped]`
        } else {
          transOutputBox.textContent = `[Error: ${err.message || err}]`
          console.error(err)
        }
      } finally {
        busy = false
        abortCtrl = null
        runTransBtn.textContent = 'Translate'
      }
    }

    runTransBtn.onclick = runTranslation

    async function sendMessage() {
      if (busy) {
        abortCtrl?.abort()
        return
      }
      const text = promptInput.value.trim()
      if (!text || !engine) return
      busy = true
      abortCtrl = new AbortController()
      promptInput.value = ''
      sendBtn.textContent = 'Stop'

      messages.push({ role: 'user', content: text })
      const userDiv = document.createElement('div')
      userDiv.className = 'msg user'
      userDiv.textContent = text
      chatBox.appendChild(userDiv)

      const asstDiv = document.createElement('div')
      asstDiv.className = 'msg assistant'
      const contentDiv = document.createElement('div')
      contentDiv.className = 'md-body'
      const statsDiv = document.createElement('div')
      statsDiv.className = 'stats'
      asstDiv.appendChild(contentDiv)
      asstDiv.appendChild(statsDiv)
      chatBox.appendChild(asstDiv)
      chatBox.scrollTop = chatBox.scrollHeight

      let rawOut = ''
      try {
        const res = await engine.generate(messages, {
          maxNewTokens: 512,
          temperature: 0.5,
          topK: 20,
          minP: 0.05,
          repetitionPenalty: 1.1,
          signal: abortCtrl.signal,
          onToken: (_id, delta) => {
            rawOut += delta
            contentDiv.innerHTML = renderMarkdown(rawOut)
            chatBox.scrollTop = chatBox.scrollHeight
          },
        })
        messages.push({ role: 'assistant', content: res.text })
        statsDiv.textContent =
          `${res.stats.generatedTokens} tokens · ${res.stats.decodeTokensPerSec.toFixed(1)} tok/s · prefill ${res.stats.prefillMs.toFixed(0)} ms (${res.stats.promptTokens} tok)` +
          (res.stats.reusedCache ? ' · cache reused' : '')
      } catch (err) {
        if (err.name === 'AbortError') {
          rawOut += ' *[stopped]*'
          contentDiv.innerHTML = renderMarkdown(rawOut)
        } else {
          contentDiv.textContent = `${rawOut}\n[Error: ${err.message || err}]`
          console.error(err)
        }
      } finally {
        busy = false
        abortCtrl = null
        sendBtn.textContent = 'Send'
        sendBtn.disabled = false
        promptInput.focus()
      }
    }

    sendBtn.onclick = sendMessage
    promptInput.onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault()
        sendMessage()
      }
    }
  </script>
</body>
</html>
